<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gerador de QR Code</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main>
            <div class="start">
                <input
                    id="start__input"
                    type="text"
                    placeholder="Insira seu link"
                />
                <button id="start__btn">Gerar QR-Code</button>
            </div>
            <div class="qrcode">
                <div id="qrcode__code"></div>
            </div>
        </main>
    </body>
    <script defer src="app.js"></script>
</html>
